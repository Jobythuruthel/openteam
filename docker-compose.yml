# Local development and single host self-hosting.
#   docker compose up -d postgres redis        # dependencies only, run apps with pnpm dev
#   docker compose --profile app up -d --build # full stack from production images
name: openteam

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openteam}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Development mail catcher. Every email the worker sends lands here: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  migrate:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openteam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openteam}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-openteam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openteam}
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-openteam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openteam}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailpit}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/next.Dockerfile
      args:
        APP: web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy

  cms:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/next.Dockerfile
      args:
        APP: cms
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    environment:
      PORT: 3001
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
